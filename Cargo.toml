[package]
name = "music-player-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Graphics_Imaging", "Storage_Streams", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp", "Media", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_DataExchange"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
